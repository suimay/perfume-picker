<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HYANG | 오늘의 향기 추천</title>
    <link rel="stylesheet" href="style/reset.css" />
    <link rel="stylesheet" href="style/base.css" />
    <link rel="stylesheet" href="style/home.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
    />
  </head>
  <body data-page="home">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="topbar__brand" href="index.html" aria-label="향 홈">
          <i class="ri-flower-line" aria-hidden="true"></i>
          <span>향(香)</span>
        </a>
        <nav class="topbar__nav" aria-label="주요 메뉴">
          <ul class="topbar__menu">
            <li>
              <a class="topbar__link" href="select.html" data-nav="select">
                <i class="ri-settings-3-line" aria-hidden="true"></i>
                <span>취향 선택</span>
              </a>
            </li>
            <li>
              <a class="topbar__link" href="result.html" data-nav="result">
                <i class="ri-task-line" aria-hidden="true"></i>
                <span>추천 결과</span>
              </a>
            </li>
            <li>
              <a class="topbar__link" href="catalog.html" data-nav="catalog">
                <i class="ri-information-line" aria-hidden="true"></i>
                <span>향수 목록</span>
              </a>
            </li>
          </ul>
        </nav>
        <a class="login-btn" id="topbarAuthButton" href="login.html">
          <i class="ri-arrow-right-line" aria-hidden="true"></i>
          <span data-label>로그인</span>
        </a>
      </div>
    </header>

    <main class="home-main">
      <section class="home-identity" aria-labelledby="identityTitle">
        <div class="home-identity__text">
          <h1 id="identityTitle">보이지 않는 향을, 느껴지는 감각으로</h1>
          <p>날씨의 체감과 색의 경험을 더해, 향을 감각으로 전하다.</p>
        </div>
        <img
          src="../hyangtypo.png"
          alt="보이지 않는 향을, 느껴지는 감각으로"
          class="home-identity__typo"
        />
      </section>

      <section class="home-flip" aria-label="날씨 기반 즉시 추천 카드">
        <div class="home-flip__wrapper">
          <div
            class="home-flip__card"
            id="instantWeatherCard"
            role="button"
            tabindex="0"
            aria-pressed="false"
            aria-live="polite"
          >
            <div class="home-flip__face home-flip__face--front">
              <header class="home-flip__header">
                <i
                  id="instantWeatherIcon"
                  class="ri-sun-line"
                  aria-hidden="true"
                ></i>
                <div>
                  <p class="home-flip__label">오늘의 날씨</p>
                  <p id="instantWeatherStatus" class="home-flip__value--large">
                    맑음
                  </p>
                </div>
              </header>
              <div class="home-flip__metrics">
                <span>기온<strong id="instantWeatherTemp">22℃</strong></span>
                <span
                  >습도<strong id="instantWeatherHumidity">45%</strong></span
                >
              </div>
              <footer class="home-flip__hint">
                <span class="home-flip__chip">
                  <i class="ri-magic-line" aria-hidden="true"></i>
                  터치해 바로 추천 보기
                </span>
              </footer>
            </div>
            <div class="home-flip__face home-flip__face--back">
              <p class="home-flip__badge">오늘의 추천 향수</p>
              <h2 id="instantRecommendName" class="home-flip__name">
                Amber Night
              </h2>
              <p id="instantRecommendBrand" class="home-flip__brand">
                Nocturne Atelier
              </p>
              <p id="instantRecommendDesc" class="home-flip__desc">
                따뜻한 앰버와 우디 노트가 밤 공기와 어울리는 향.
              </p>
              <a
                id="instantRecommendLink"
                class="home-flip__cta"
                href="detail.html"
              >
                상세 페이지로 이동
                <i class="ri-arrow-right-up-line" aria-hidden="true"></i>
              </a>
              <p class="home-flip__hint home-flip__hint--back">
                다시 터치하면 날씨 정보가 보여요.
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <div class="site-footer__left">
          <span class="site-footer__copy"
            >© 2025 KSNU 2500131 SUIN. 향(香)</span
          >
          <nav class="site-footer__links" aria-label="법적 고지">
            <a href="#" class="site-footer__link" data-footer-link="terms"
              >이용약관</a
            >
            <a href="#" class="site-footer__link" data-footer-link="privacy"
              >개인정보처리방침</a
            >
          </nav>
        </div>
        <div class="site-footer__right" aria-label="소셜 링크">
          <a
            class="site-footer__icon"
            href="mailto:atomsyndrome@gmail.com"
            aria-label="메일"
          >
            <i class="ri-mail-line" aria-hidden="true"></i>
          </a>
          <a
            class="site-footer__icon"
            href="https://www.instagram.com/ooinlees?igsh=MWw4eGRkamEweDd0cQ%3D%3D&utm_source=qr"
            target="_blank"
            rel="noopener"
            aria-label="인스타그램"
          >
            <i class="ri-instagram-line" aria-hidden="true"></i>
          </a>
          <a
            class="site-footer__icon"
            href="https://www.notion.so/amilab/26f763f6955a802e8e48e466b95da239?source=copy_link"
            target="_blank"
            rel="noopener"
            aria-label="노션"
          >
            <i class="ri-file-list-line" aria-hidden="true"></i>
          </a>
          <a
            class="site-footer__icon"
            href="https://github.com/suimay/perfume-picker"
            target="_blank"
            rel="noopener"
            aria-label="깃허브"
          >
            <i class="ri-github-line" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </footer>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
