<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HYANG | 로그인</title>
    <link rel="stylesheet" href="style/reset.css" />
    <link rel="stylesheet" href="style/base.css" />
    <link rel="stylesheet" href="style/auth.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
    />
  </head>
  <body data-page="login">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="topbar__brand" href="index.html" aria-label="향 홈">
          <i class="ri-flower-line" aria-hidden="true"></i>
          <span>향(香)</span>
        </a>
        <nav class="topbar__nav" aria-label="주요 메뉴">
          <ul class="topbar__menu">
            <li>
              <a class="topbar__link" href="select.html" data-nav="select">
                <i class="ri-settings-3-line" aria-hidden="true"></i>
                <span>취향 선택</span>
              </a>
            </li>
            <li>
              <a class="topbar__link" href="result.html" data-nav="result">
                <i class="ri-task-line" aria-hidden="true"></i>
                <span>추천 결과</span>
              </a>
            </li>
            <li>
              <a class="topbar__link" href="catalog.html" data-nav="catalog">
                <i class="ri-information-line" aria-hidden="true"></i>
                <span>향수 목록</span>
              </a>
            </li>
          </ul>
        </nav>
        <a class="login-btn" id="topbarAuthButton" href="login.html">
          <i class="ri-arrow-right-line" aria-hidden="true"></i>
          <span data-label>로그인</span>
        </a>
      </div>
    </header>

    <main class="auth-page">
      <section class="auth-card">
        <h1 class="auth-card__title">로그인</h1>
        <p class="auth-card__lead">
          HYANG 계정으로 로그인하고 개인 취향에 맞춘 추천을 저장하세요.
        </p>
        <p class="form__helper" id="loginHelper" hidden></p>
        <form id="loginForm" class="auth-panel" autocomplete="on">
          <div class="form-field">
            <label for="loginEmail">이메일</label>
            <input
              type="email"
              id="loginEmail"
              name="email"
              placeholder="example@email.com"
              required
            />
          </div>
          <div class="form-field">
            <label for="loginPassword">비밀번호</label>
            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="비밀번호를 입력하세요"
              required
            />
          </div>
          <p class="form__error" id="loginError"></p>
          <button class="auth-submit" type="submit">로그인</button>
        </form>
        <p class="auth-card__footer">
          계정이 없으신가요?
          <a href="signup.html">회원가입</a>
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <div class="site-footer__left">
          <span class="site-footer__copy"
            >© 2025 KSNU 2500131 SUIN. 향(香)</span
          >
          <nav class="site-footer__links" aria-label="법적 고지">
            <a href="#" class="site-footer__link" data-footer-link="terms"
              >이용약관</a
            >
            <a href="#" class="site-footer__link" data-footer-link="privacy"
              >개인정보처리방침</a
            >
          </nav>
        </div>
        <div class="site-footer__right" aria-label="소셜 링크">
          <a
            class="site-footer__icon"
            href="mailto:atomsyndrome@gmail.com"
            aria-label="메일"
          >
            <i class="ri-mail-line" aria-hidden="true"></i>
          </a>
          <a
            class="site-footer__icon"
            href="https://www.instagram.com/ooinlees?igsh=MWw4eGRkamEweDd0cQ%3D%3D&utm_source=qr"
            target="_blank"
            rel="noopener"
            aria-label="인스타그램"
          >
            <i class="ri-instagram-line" aria-hidden="true"></i>
          </a>
          <a
            class="site-footer__icon"
            href="https://www.notion.so/amilab/26f763f6955a802e8e48e466b95da239?source=copy_link"
            target="_blank"
            rel="noopener"
            aria-label="노션"
          >
            <i class="ri-file-list-line" aria-hidden="true"></i>
          </a>
          <a
            class="site-footer__icon"
            href="https://github.com/suimay/perfume-picker"
            target="_blank"
            rel="noopener"
            aria-label="깃허브"
          >
            <i class="ri-github-line" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </footer>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
