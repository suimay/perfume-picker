<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HYANG | 회원가입</title>
    <link rel="stylesheet" href="style/reset.css" />
    <link rel="stylesheet" href="style/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
    />
  </head>
  <body data-page="signup">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="topbar__brand" href="index.html" aria-label="향 홈">
          <i class="ri-flower-line" aria-hidden="true"></i>
          <span>향(香)</span>
        </a>
        <nav class="topbar__nav" aria-label="주요 메뉴">
          <ul class="topbar__menu">
            <li>
              <a class="topbar__link" href="select.html" data-nav="select">
                <i class="ri-settings-3-line" aria-hidden="true"></i>
                <span>취향 선택</span>
              </a>
            </li>
            <li>
              <a class="topbar__link" href="result.html" data-nav="result">
                <i class="ri-task-line" aria-hidden="true"></i>
                <span>추천 결과</span>
              </a>
            </li>
            <li>
              <a class="topbar__link" href="mypage.html" data-nav="mypage">
                <i class="ri-information-line" aria-hidden="true"></i>
                <span>향수 목록</span>
              </a>
            </li>
          </ul>
        </nav>
        <a class="login-btn" href="login.html">
          <i class="ri-login-box-line" aria-hidden="true"></i>
          <span>로그인</span>
        </a>
      </div>
    </header>

    <main class="auth-page">
      <section class="auth-card">
        <h1 class="auth-card__title">회원가입</h1>
        <p class="auth-card__lead">
          몇 가지 정보만 입력하면 개인 취향에 맞는 향수 추천을 저장할 수 있습니다.
        </p>
        <form id="registerForm" class="auth-panel" autocomplete="on">
          <div class="form-field">
            <label for="registerEmail">이메일</label>
            <input
              type="email"
              id="registerEmail"
              name="email"
              placeholder="example@email.com"
              required
            />
          </div>
          <div class="form-field">
            <label for="registerPassword">비밀번호</label>
            <input
              type="password"
              id="registerPassword"
              name="password"
              placeholder="8자 이상 입력해주세요"
              required
            />
          </div>
          <div class="form-field">
            <label for="registerNickname">닉네임</label>
            <input
              type="text"
              id="registerNickname"
              name="nickname"
              placeholder="사용할 닉네임"
              required
            />
          </div>
          <p class="form__error" id="registerError"></p>
          <button class="auth-submit" type="submit">회원가입 완료</button>
        </form>
        <p class="auth-card__footer">
          이미 계정이 있으신가요?
          <a href="login.html">로그인 페이지로 이동</a>
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <div class="site-footer__left">
          <span class="site-footer__copy">© 2025 KSNU 2500131 SUIN. 향(香)</span>
          <nav class="site-footer__links" aria-label="법적 고지">
            <a href="#" class="site-footer__link" data-footer-link="terms">이용약관</a>
            <a href="#" class="site-footer__link" data-footer-link="privacy">개인정보처리방침</a>
          </nav>
        </div>
        <div class="site-footer__right" aria-label="소셜 링크">
          <a class="site-footer__icon" href="mailto:atomsyndrome@gmail.com" aria-label="메일">
            <i class="ri-mail-line" aria-hidden="true"></i>
          </a>
          <a
            class="site-footer__icon"
            href="https://www.instagram.com/ooinlees?igsh=MWw4eGRkamEweDd0cQ%3D%3D&utm_source=qr"
            target="_blank"
            rel="noopener"
            aria-label="인스타그램"
          >
            <i class="ri-instagram-line" aria-hidden="true"></i>
          </a>
          <a
            class="site-footer__icon"
            href="https://www.notion.so/amilab/26f763f6955a802e8e48e466b95da239?source=copy_link"
            target="_blank"
            rel="noopener"
            aria-label="노션"
          >
            <i class="ri-file-list-line" aria-hidden="true"></i>
          </a>
          <a
            class="site-footer__icon"
            href="https://github.com/suimay/perfume-picker"
            target="_blank"
            rel="noopener"
            aria-label="깃허브"
          >
            <i class="ri-github-line" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </footer>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
